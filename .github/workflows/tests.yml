name: Validate benchmark and runner

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Validate case references and manifests
        run: python scripts/validate_dataset.py
      - name: Validate utility provenance and tool behavior
        run: python scripts/validate_lps_utility_cases.py --report /tmp/lps-utility-validation.json
      - name: Run offline regression tests
        run: >-
          python -m pytest tests
          experiments/mcp_bench_utility/test_experiment.py
          experiments/safearena_utility/test_prompt_ablation.py -q
