<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="580" viewBox="0 0 1200 580" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">LPS-Bench: evaluate safety throughout the agent trajectory</title>
  <desc id="desc">Benign ambiguity and adversarial steering enter a computer-use task. The agent plans, calls simulated tools, observes their output and replans. A case-specific evaluator checks the complete trajectory across seven domains. Safe Rate measures trajectories that stay safe throughout.</desc>
  <defs>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#dfe7ed"/></pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#71859a"/></marker>
    <linearGradient id="panel" x1="40" y1="0" x2="1150" y2="580" gradientUnits="userSpaceOnUse"><stop stop-color="#f6faff"/><stop offset="1" stop-color="#f3f9f6"/></linearGradient>
  </defs>
  <rect x="1" y="1" width="1198" height="578" rx="22" fill="url(#panel)" stroke="#e0e7ec"/>
  <rect x="2" y="2" width="1196" height="576" rx="21" fill="url(#dots)"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="46" y="47" font-size="13" font-weight="700" letter-spacing="2" fill="#526880">THE BENCHMARK AT A GLANCE</text>
    <text x="46" y="85" font-size="27" font-weight="700" fill="#1d3049">Safety is a property of the whole plan.</text>
    <text x="46" y="111" font-size="15" fill="#526880">Inspect decisions, tool calls, and feedback throughout a computer-use task.</text>

    <rect x="44" y="155" width="247" height="120" rx="13" fill="white" stroke="#cddfea"/>
    <rect x="60" y="173" width="34" height="26" rx="6" fill="#e9f2fc"/>
    <text x="77" y="191" text-anchor="middle" font-size="14" font-weight="700" fill="#3268a2">01</text>
    <text x="105" y="191" font-size="16" font-weight="700" fill="#1d3049">Benign ambiguity</text>
    <text x="63" y="226" font-size="14" fill="#526880">Unclear intent, unsafe ordering,</text>
    <text x="63" y="248" font-size="14" fill="#526880">over-compliance, resource waste</text>

    <rect x="44" y="295" width="247" height="120" rx="13" fill="white" stroke="#e8d6c5"/>
    <rect x="60" y="313" width="34" height="26" rx="6" fill="#fff1e6"/>
    <text x="77" y="331" text-anchor="middle" font-size="14" font-weight="700" fill="#a75a2b">02</text>
    <text x="105" y="331" font-size="16" font-weight="700" fill="#1d3049">Adversarial steering</text>
    <text x="63" y="366" font-size="14" fill="#526880">Manipulated requests, histories,</text>
    <text x="63" y="388" font-size="14" fill="#526880">tool outputs, and timing</text>

    <path d="M292 215H312V285H337M292 355H312V285" stroke="#71859a" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="345" y="155" width="498" height="260" rx="13" fill="white" stroke="#d0dedb"/>
    <text x="369" y="189" font-size="13" font-weight="700" letter-spacing="1.5" fill="#426c61">LONG-HORIZON AGENT TRAJECTORY</text>
    <rect x="369" y="220" width="118" height="99" rx="10" fill="#f0f5fb"/>
    <path d="M388 243H411M388 251H416M388 259H405" stroke="#416c9f" stroke-width="2" stroke-linecap="round"/>
    <text x="387" y="295" font-size="17" font-weight="700" fill="#294b72">Plan</text>
    <path d="M493 269H518" stroke="#71859a" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="527" y="220" width="134" height="99" rx="10" fill="#edf6f2"/>
    <path d="m555 242-8 8 8 8m12-16 8 8-8 8" stroke="#297058" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="546" y="295" font-size="17" font-weight="700" fill="#26604c">Call tools</text>
    <path d="M667 269H691" stroke="#71859a" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="701" y="220" width="118" height="99" rx="10" fill="#f0f5fb"/>
    <path d="M722 241H743V257H727L722 262Z" stroke="#416c9f" stroke-width="2" stroke-linejoin="round"/>
    <text x="718" y="295" font-size="17" font-weight="700" fill="#294b72">Observe</text>
    <path d="M760 328V353H428V328" stroke="#71859a" stroke-width="1.8" stroke-dasharray="5 5" marker-end="url(#arrow)"/>
    <rect x="536" y="341" width="116" height="24" fill="white"/>
    <text x="594" y="358" text-anchor="middle" font-size="13" fill="#526880">Replan &amp; repeat</text>
    <text x="594" y="392" text-anchor="middle" font-size="13" fill="#526880">Case-specific simulated tools · Direct tools or reusable skills</text>

    <path d="M850 285H881" stroke="#71859a" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="890" y="155" width="266" height="260" rx="13" fill="#1c453e"/>
    <path d="M1005 190 1023 182 1041 190V206C1041 220 1023 228 1023 228S1005 220 1005 206Z" stroke="#c8e8d9" stroke-width="2"/>
    <path d="m1015 204 6 6 12-13" stroke="#c8e8d9" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="1023" y="263" text-anchor="middle" font-size="20" font-weight="700" fill="white">Evaluate every step</text>
    <text x="1023" y="291" text-anchor="middle" font-size="14" fill="#d3e8e1">Full trace + safety criterion</text>
    <path d="M916 312H1130" stroke="#4b7066"/>
    <text x="1023" y="343" text-anchor="middle" font-size="15" font-weight="700" fill="#d3e8e1">Trajectory-level Safe Rate</text>
    <text x="1023" y="370" text-anchor="middle" font-size="13" fill="#d3e8e1">A safe final answer alone</text>
    <text x="1023" y="390" text-anchor="middle" font-size="13" fill="#d3e8e1">does not establish a safe trajectory.</text>

    <path d="M45 450H1155" stroke="#d7e2e7"/>
    <text x="46" y="480" font-size="12" font-weight="700" letter-spacing="1.8" fill="#526880">7 COMPUTER-USE DOMAINS</text>
    <g font-size="14" fill="#314c66">
      <text x="46" y="520">Web Browser</text><text x="229" y="520">Code</text><text x="356" y="520">File I/O</text><text x="501" y="520">Multimedia</text><text x="678" y="520">Social Media</text><text x="869" y="520">OS Operation</text><text x="1074" y="520">Office</text>
    </g>
    <text x="46" y="550" font-size="12" fill="#62768a">570 base cases · 252 benign / 318 adversarial · 9 risk types · 40 skill-augmented variants</text>
  </g>
</svg>
